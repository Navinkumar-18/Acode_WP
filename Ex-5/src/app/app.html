<div style="width:400px;padding:20px;margin:20px;border:1cm solid black;">
   <h2>Order Form</h2>
   <label>Select Product:</label>
   <select [(ngModel)]="selectedProduct">
     <option *ngFor="let product of products" [ngValue]="product">{{product.name}}-{{product.prize}}</option>
   </select>
   <label>Quantity:</label>
   <input type="number" [(ngModel)]="quantity" min="1">
   <h3>Total Prize:{{total}}</h3>

</div>
